name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test
      - run: mvn -Dtest=PostgresFlywayIntegrationTest test
      - run: mvn package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test --workspace=@training/mobile-api
      - run: npm run test --workspace=@training/workout-session-core
      - run: npm run typecheck --workspace=training-mobile
      - run: npm run test --workspace=training-mobile
      - run: npm run typecheck --workspace=umamusume-mobile
      - run: npm exec --workspace=training-mobile -- expo install --check
      - run: npm exec --workspace=training-mobile -- expo export --platform android --output-dir dist

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.beta.yml config
      - run: docker compose -f compose.beta.yml build
