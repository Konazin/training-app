spring.application.name=training-api
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false

app.version=@project.version@
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
app.security.enabled=${APP_SECURITY_ENABLED:false}
app.api-token=${APP_API_TOKEN:}

wger.integration-enabled=${WGER_INTEGRATION_ENABLED:false}
wger.api-base-url=${WGER_API_BASE_URL:https://wger.de/api/v2}
wger.language=${WGER_LANGUAGE:pt-br}
wger.fallback-language=${WGER_FALLBACK_LANGUAGE:en}
wger.request-timeout-seconds=${WGER_REQUEST_TIMEOUT_SECONDS:15}
wger.page-size=${WGER_PAGE_SIZE:100}
wger.sync-max-pages=${WGER_SYNC_MAX_PAGES:0}
wger.sync-lock-timeout-minutes=${WGER_SYNC_LOCK_TIMEOUT_MINUTES:60}

# Server-only. Never expose GEMINI_API_KEY through Expo variables or mobile source.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api-base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
gemini.request-timeout-seconds=${GEMINI_REQUEST_TIMEOUT_SECONDS:20}
gemini.max-image-bytes=${GEMINI_MAX_IMAGE_BYTES:5242880}
gemini.meal-parse-thinking-level=${GEMINI_MEAL_PARSE_THINKING_LEVEL:low}
gemini.meal-vision-thinking-level=${GEMINI_MEAL_VISION_THINKING_LEVEL:low}
gemini.diet-plan-thinking-level=${GEMINI_DIET_PLAN_THINKING_LEVEL:medium}
gemini.training-plan-thinking-level=${GEMINI_TRAINING_PLAN_THINKING_LEVEL:medium}
